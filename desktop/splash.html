<!DOCTYPE html><html><head><meta charset="utf-8"><title>KAIROS OS Beta</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<style>
:root{--ease:cubic-bezier(.16,1,.3,1)}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#050507;color:#efedf6;font:14px Inter,"Segoe UI",system-ui,sans-serif;overflow:hidden;-webkit-app-region:drag;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;opacity:0;transition:opacity 2s}body.on canvas{opacity:1}
.glow{position:fixed;inset:-20%;background:radial-gradient(40% 35% at 50% 45%,rgba(139,92,246,.22),transparent 70%);opacity:0;transition:opacity 2s}body.on .glow{opacity:1}
.lock{position:absolute;left:50%;top:44%;width:720px;transform:translate(-50%,-50%) scale(1.1);opacity:0;transition:transform 1.6s var(--ease),opacity .6s;filter:drop-shadow(0 0 30px rgba(139,92,246,.45))}
body.on .lock{opacity:1;transform:translate(-50%,-50%) scale(1)}body.up .lock{transform:translate(-50%,-128%) scale(.62)}
.st{position:absolute;left:50%;top:60%;transform:translateX(-50%);width:560px;text-align:center;opacity:0;transition:opacity .6s,transform .8s var(--ease)}body.up .st{opacity:1}
.st small{display:block;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#7c7892}
.dots i{display:inline-block;width:6px;height:6px;margin:0 3px;border-radius:50%;background:#b98cff;animation:d 1.2s ease-in-out infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}@keyframes d{0%,100%{opacity:.2;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
.card{display:none;margin-top:6px;text-align:left;padding:18px 20px;border-radius:16px;background:rgba(18,16,28,.9);border:1px solid rgba(185,140,255,.3);box-shadow:0 30px 80px -20px rgba(0,0,0,.8);animation:in .6s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.card h2{margin:0 0 4px;font:600 20px Inter,"Segoe UI";letter-spacing:-.01em}.card h2 em{font-style:normal;color:#b98cff}.card .notes{max-height:150px;overflow:auto;color:#b4b0c6;font-size:13px;line-height:1.55;margin:8px 0 14px;-webkit-app-region:no-drag}
.card .notes ul{margin:4px 0;padding-left:18px}.row{display:flex;gap:10px;justify-content:flex-end;-webkit-app-region:no-drag}
button{font:500 13.5px Inter,"Segoe UI";border-radius:10px;padding:10px 18px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:#ddd9ee;cursor:pointer}
button.p{background:linear-gradient(180deg,#8b5cf6,#6d3fe0);border-color:#9b72ff;color:#fff;box-shadow:0 8px 30px -8px rgba(139,92,246,.8)}button:hover{filter:brightness(1.12)}
.prog{display:none;margin-top:4px}.ring{position:relative;width:132px;height:132px;margin:0 auto 10px}.ring svg{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:6}.ring .bg{stroke:rgba(255,255,255,.08)}.ring .fg{stroke:url(#gr);stroke-linecap:round;transition:stroke-dashoffset .3s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:300 28px Inter,"Segoe UI"}.ring.spin svg{animation:sp 1.1s linear infinite}@keyframes sp{to{transform:rotate(270deg)}}
.prog span{color:#9a96b0;font-size:12.5px}
.ver{position:fixed;right:16px;bottom:12px;font-size:11px;color:#4f4c60;letter-spacing:.08em}
.x{position:fixed;top:10px;right:12px;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#6d6a80;-webkit-app-region:no-drag;cursor:pointer}.x:hover{background:rgba(255,255,255,.06);color:#fff}
body.bye{opacity:0;transition:opacity .6s}
</style></head><body>
<canvas id="f"></canvas><div class="glow"></div>
<img class="lock" id="lock" alt="KAIROS OS Beta">
<div class="st"><div id="chk"><small>Checking for updates</small><div class="dots" style="margin-top:12px"><i></i><i></i><i></i></div></div>
  <div class="card" id="card"><h2>A new version is here: <em id="nv"></em></h2><div class="tiny" style="color:#7c7892;font-size:12px">You're on <span id="cv"></span>. Here's what's new:</div><div class="notes" id="notes"></div><div class="row"><button id="later">Later</button><button class="p" id="now">Update now</button></div></div>
  <div class="prog" id="prog"><div class="ring" id="ring"><svg width="132" height="132"><defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e4d6ff"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs><circle class="bg" cx="66" cy="66" r="58"/><circle class="fg" id="fg" cx="66" cy="66" r="58" stroke-dasharray="364.4" stroke-dashoffset="364.4"/></svg><b id="pct">0%</b></div><span id="ptxt">Downloading the update…</span></div>
</div>
<div class="ver" id="ver"></div><div class="x" id="x" title="Close">✕</div>
<script>
const q = new URLSearchParams(location.search), V = q.get("v") || ""; document.getElementById("ver").textContent = "KAIROS OS Beta " + V; document.getElementById("cv").textContent = V;
document.getElementById("x").onclick = () => window.close();
document.getElementById("lock").src = "web/brand/kairos-intro.svg?" + Date.now();
// flowing line field
const cv = document.getElementById("f"), g = cv.getContext("2d"), D = Math.min(devicePixelRatio || 1, 2); let W, H, T = 0; const rs = () => { W = cv.width = innerWidth * D; H = cv.height = innerHeight * D; }; rs();
(function fr() { T += 0.005; g.clearRect(0, 0, W, H); for (let i = 0; i < 30; i++) { const b = i / 29, y0 = H * (0.08 + b * 0.92), a = 0.04 + 0.16 * Math.sin(Math.PI * b) ** 2; g.beginPath(); for (let x = 0; x <= W + 10; x += 10 * D) { const u = x / W, y = y0 + Math.sin(u * 6 + T * 3 + b * 4) * 12 * D + Math.sin(u * 2.2 - T * 1.7 + b * 9) * 18 * D; x ? g.lineTo(x, y) : g.moveTo(x, y); } g.strokeStyle = `rgba(185,140,255,${a})`; g.lineWidth = D * 0.8; g.stroke(); } requestAnimationFrame(fr); })();
// sound: rising notes + soft drop
let A = null; try { A = new AudioContext(); } catch (e) {}
function tone(f, t0, dur, vol, type = "sine") { if (!A) return; const o = A.createOscillator(), gg = A.createGain(); o.type = type; o.frequency.value = f; gg.gain.setValueAtTime(0, t0); gg.gain.linearRampToValueAtTime(vol, t0 + 0.015); gg.gain.exponentialRampToValueAtTime(0.0001, t0 + dur); o.connect(gg); gg.connect(A.destination); o.start(t0); o.stop(t0 + dur + 0.05); }
function intro() { if (!A) return; const t = A.currentTime + 0.05; [220, 261.63, 329.63, 392, 440, 523.25, 659.25, 783.99].forEach((f, k) => tone(f, t + 0.1 + k * 0.08, 1.4, 0.05));
  const b = A.createOscillator(), bg = A.createGain(); b.frequency.setValueAtTime(110, t + 0.8); b.frequency.exponentialRampToValueAtTime(38, t + 1.9); bg.gain.setValueAtTime(0, t + 0.8); bg.gain.linearRampToValueAtTime(0.4, t + 0.85); bg.gain.exponentialRampToValueAtTime(0.001, t + 2.4); b.connect(bg); bg.connect(A.destination); b.start(t + 0.8); b.stop(t + 2.5); }
function chord(up) { if (!A) return; const t = A.currentTime + 0.02; (up ? [392, 493.88, 587.33, 783.99] : [261.63, 329.63, 392]).forEach((f, k) => tone(f, t + k * 0.06, 1.2, 0.04, "triangle")); }
requestAnimationFrame(() => { document.body.classList.add("on"); intro(); });
setTimeout(() => { document.body.classList.add("up"); kz.introDone(); }, 2600);
const $ = (id) => document.getElementById(id), fg = $("fg"), C = 364.4;
kz.on((d) => {
  if (d.s === "checking") { $("chk").style.display = ""; }
  if (d.s === "none") { $("chk").querySelector("small").textContent = "You're up to date"; }
  if (d.s === "available") { $("chk").style.display = "none"; $("card").style.display = "block"; $("nv").textContent = d.version; $("notes").innerHTML = d.notes || "Fixes and improvements."; chord(true); }
  if (d.s === "downloading") { $("card").style.display = "none"; $("prog").style.display = "block"; const p = Math.max(0, Math.min(100, d.percent || 0)); fg.style.strokeDashoffset = C * (1 - p / 100); $("pct").textContent = Math.round(p) + "%";
    if (d.speed) $("ptxt").textContent = `Downloading the update… ${(d.speed / 1048576).toFixed(1)} MB/s`; }
  if (d.s === "installing") { $("ring").classList.add("spin"); fg.style.strokeDashoffset = C * 0.72; $("pct").textContent = "✓"; $("ptxt").textContent = "Installing. KAIROS restarts in a moment…"; chord(true); }
  if (d.s === "error") { $("prog").style.display = "none"; $("chk").style.display = ""; $("chk").querySelector("small").textContent = "Couldn't update right now. Opening KAIROS…"; }
  if (d.s === "bye") document.body.classList.add("bye");
});
$("now").onclick = () => kz.updateNow(); $("later").onclick = () => kz.later();
</script></body></html>
