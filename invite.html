<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KAIROS OS · coming soon</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-180.png"><meta name="theme-color" content="#0a0a0d">
<meta name="robots" content="noindex"><meta property="og:title" content="KAIROS OS"><meta property="og:description" content="The right moment, on repeat. Still under development.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--v:#8b5cf6;--v2:#b98cff;--txt:#ecebf3;--mut:#8b8a99}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0a0a0d;color:var(--txt);font:15px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
canvas#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.glow{position:fixed;left:50%;top:32%;width:900px;height:900px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(139,92,246,.20),rgba(139,92,246,0) 60%);animation:breathe 7s ease-in-out infinite;z-index:0;pointer-events:none}
@keyframes breathe{0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(.95)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}}
main{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:9vh 22px 60px;text-align:center}
.mk{width:150px;height:150px;filter:drop-shadow(0 0 40px rgba(139,92,246,.45));animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both}
.mk .hand,.mk .tip{transform-origin:212px 262px;animation:tick 12s cubic-bezier(.7,0,.3,1) infinite}
.mk .arc{stroke-dasharray:240;stroke-dashoffset:240;animation:arc 12s ease-in-out infinite}
@keyframes tick{0%,18%{transform:rotate(0)}25%,43%{transform:rotate(-6deg)}50%,68%{transform:rotate(3deg)}75%,100%{transform:rotate(0)}}
@keyframes arc{0%{stroke-dashoffset:240}40%,70%{stroke-dashoffset:0}100%{stroke-dashoffset:-240}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.92)}to{opacity:1;transform:none}}
.wm{display:block;width:min(520px,82vw);margin:28px auto 6px;animation:rise 1.1s .15s cubic-bezier(.2,.8,.2,1) both}
.pill{display:inline-flex;align-items:center;gap:8px;margin:14px 0 18px;padding:6px 14px;border-radius:999px;border:1px solid rgba(167,139,250,.35);background:rgba(139,92,246,.08);color:#cdbaff;font:600 12px Inter;letter-spacing:1.5px;text-transform:uppercase;animation:rise 1s .3s both}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--v2);box-shadow:0 0 10px var(--v2);animation:blink 1.6s ease-in-out infinite}@keyframes blink{50%{opacity:.25}}
h1{font:600 clamp(26px,4.4vw,40px)/1.15 Inter;letter-spacing:-.02em;margin:6px 0 10px;animation:rise 1s .4s both}
.lead{max-width:640px;margin:0 auto;color:var(--mut);font-size:16.5px;animation:rise 1s .5s both}.hi{color:var(--txt)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin:46px 0 10px;text-align:left}
.f{padding:18px 18px 16px;border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));border:1px solid rgba(255,255,255,.07);opacity:0;animation:rise .9s both}
.f b{display:block;font-size:15px;margin:8px 0 4px}.f p{margin:0;color:var(--mut);font-size:13.5px}.f svg{width:26px;height:26px;color:var(--v2)}
.f:hover{border-color:rgba(167,139,250,.35);transform:translateY(-2px);transition:.25s}
footer{margin-top:40px;color:#5d5c69;font-size:12.5px}footer a{color:#a78bfa;text-decoration:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.f{opacity:1}}
</style></head><body>
<canvas id="bg"></canvas><div class="glow"></div>
<main>
<svg class="mk" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16161b"/><stop offset="1" stop-color="#08080a"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3b44"/><stop offset=".5" stop-color="#1c1d22"/><stop offset="1" stop-color="#2b2c33"/></linearGradient>
    <linearGradient id="v" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#b98cff"/></linearGradient>
    <radialGradient id="uv" cx=".62" cy=".38" r=".6"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".30"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#uv)"/>
  <rect x="9.5" y="9.5" width="493" height="493" rx="110.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <!-- dial: the right moment -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#2a2b33" stroke-width="6"/>
  <path class="arc" d="M256 88 A168 168 0 0 1 401.5 172" fill="none" stroke="url(#v)" stroke-width="6" stroke-linecap="round" opacity=".85"/>
  <g stroke="#3a3b44" stroke-width="5" stroke-linecap="square"><path d="M256 104v14M408 256h-14M256 408v-14M104 256h14"/></g>
  <!-- K: stem + two sharp arms; the upper arm is the clock hand -->
  <g fill="none" stroke-linejoin="miter" stroke-miterlimit="10">
    <path d="M196 150V362" stroke="#e9e7f2" stroke-width="34"/>
    <path d="M212 262L334 362" stroke="#e9e7f2" stroke-width="34"/>
    <path class="hand" d="M212 262L380 132" stroke="url(#v)" stroke-width="34" filter="url(#glow)"/>
  </g>
  <circle class="tip" cx="389" cy="125" r="13" fill="#d6c2ff" filter="url(#glow)"/>
</svg>

<svg class="wm" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 120">
  <defs>
    <linearGradient id="v" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#b98cff"/></linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="700" height="120"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g fill="none" stroke="#ecebf3" stroke-width="10" stroke-linejoin="miter" stroke-miterlimit="10" stroke-linecap="butt">
    <!-- K -->
    <path d="M12 20V100"/><path d="M18 62L66 100"/>
    <path d="M18 62L72 18" stroke="url(#v)" filter="url(#glow)"/>
    <!-- A without the bar: a sharp peak -->
    <path d="M104 100L142 18L180 100"/>
    <!-- I -->
    <path d="M218 20V100"/>
    <!-- R: angled bowl + leg -->
    <path d="M258 100V20H302L318 38V48L302 62H258"/><path d="M294 62L322 100"/>
    <!-- O: geometric ring -->
    <circle cx="398" cy="60" r="40"/>
    <!-- S: cut from straight lines -->
    <path d="M532 26L520 20H478L462 34V46L478 60H514L530 74V86L514 100H470L458 94"/>
  </g>
  <circle cx="76" cy="15" r="5" fill="#d6c2ff" filter="url(#glow)"/>
  <text x="566" y="100" font-family="Inter, Segoe UI, sans-serif" font-weight="600" font-size="22" letter-spacing="3" fill="#8b5cf6">OS</text>
</svg>

<div class="pill"><i></i>Still under development</div>
<h1 id="greet">You're on the list.</h1>
<p class="lead"><span class="hi">KAIROS OS</span> is a private futures replay built for our group. Rewind any NQ or ES session bar by bar, trade it like it's live, and get better together. The doors open soon. You'll be one of the first ones in.</p>
<div class="grid" id="feats"></div>
<footer>KAIROS OS v0.5 · invite only · built by King<br><span id="me"></span></footer>
</main>
<script>
const F=[["Real replay, bar by bar","Five years of real NQ and ES, down to 15-second candles. Step, play, or jump to the open. No peeking at candles that haven't happened.",'<path d="M4 19V9M9 19V5M14 19v-7M19 19V8"/><path d="M3 19h18"/>'],
["Trade it like it's live","Scalp pad, DOM, brackets, breakeven, hotkeys and prop-firm rules (daily loss limit, drawdown, lockout).",'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>'],
["ICT tools built in","Sessions, FVGs and inversions, order blocks, data highs/lows, equal highs/lows, higher-timeframe candles on the side.",'<rect x="4" y="5" width="16" height="6" rx="1"/><rect x="4" y="13" width="10" height="6" rx="1"/>'],
["Learn from Reese","His real trades and screenshots unlock after you replay the same session, plus a take-it-or-fade-it trainer.",'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/>'],
["Built for the group","Live chat, same-week challenges, a leaderboard, shared trades you can rate, and a fix box that goes straight to Claude.",'<circle cx="8" cy="9" r="3"/><circle cx="17" cy="9" r="3"/><path d="M2 20c.8-3 3.3-5 6-5s5.2 2 6 5M14 16c.6-.6 1.8-1 3-1 2.7 0 5 2 5 5"/>'],
["Journal that teaches you","Trading calendar, rules followed vs broken, tilt and mistake tracking, and your real Alltra trades on the chart.",'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9h16M9 4v16"/>']];
document.getElementById("feats").innerHTML=F.map(([t,d,ic],i)=>`<div class="f" style="animation-delay:${.6+i*.08}s"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ic}</svg><b>${t}</b><p>${d}</p></div>`).join("");
const q=new URLSearchParams(location.search); if(q.get("in")) document.getElementById("greet").textContent="You're in. Just not yet.";
const n=(q.get("n")||"").replace(/[^A-Za-z ]/g,"").slice(0,20); if(n) document.getElementById("greet").textContent=`${n}, you're on the list.`;
/* idle animation: slow violet particles drifting like a time-lapse of price */
const c=document.getElementById("bg"),g=c.getContext("2d");let W,H,P=[];const R=()=>{W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio};R();addEventListener("resize",R);
for(let i=0;i<70;i++)P.push({x:Math.random(),y:Math.random(),r:Math.random()*1.6+.4,s:Math.random()*.00025+.00006,a:Math.random()*6.28});
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
(function f(t){g.clearRect(0,0,W,H);for(const p of P){if(!still){p.x+=p.s;p.a+=.004;if(p.x>1.02)p.x=-.02}const y=(p.y+Math.sin(p.a)*.01)*H;g.beginPath();g.arc(p.x*W,y,p.r*devicePixelRatio,0,7);g.fillStyle=`rgba(167,139,250,${.15+.25*Math.abs(Math.sin(p.a))})`;g.fill()}requestAnimationFrame(f)})();
</script></body></html>
