# Builds the KAIROS OS Beta Windows installer and publishes it as a GitHub release.
# Ship an update: bump desktop/package.json "version", add desktop/notes/<version>.md, push to main.
# If there's no release for that version yet, this builds the installer and publishes release v<version>.
name: Desktop app
on:
  push:
    branches: [main]
    paths: ["desktop/package.json"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    if: github.repository == 'meyerjos004/rewind'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip if this version is already released
        id: chk
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./desktop/package.json').version")
          if gh release view "v$V" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "v$V already released"; else echo "skip=0" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.chk.outputs.skip != '1'
        with:
          node-version: 20
      - name: Bundle the site into the app
        if: steps.chk.outputs.skip != '1'
        run: node desktop/copy-web.js
      - name: Install
        if: steps.chk.outputs.skip != '1'
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build + publish installer
        if: steps.chk.outputs.skip != '1'
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always
      - name: Release notes
        if: steps.chk.outputs.skip != '1'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./desktop/package.json').version")
          if [ -f "desktop/notes/$V.md" ]; then gh release edit "v$V" --title "KAIROS OS Beta $V" --notes-file "desktop/notes/$V.md"; fi
